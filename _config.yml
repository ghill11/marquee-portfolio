# _config.yml for the Marquee portfolio site (Minimal Mistakes remote_theme).
# Generated by Marquee. This file is regenerated on every publish.
# Do NOT hand-edit unless you understand it WILL be overwritten the next
# time you publish from Marquee. (Self-maintained alumni: see MAINTENANCE.md.)

remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Identity
title: "Dr. Geoffrey Hill: Portfolio"
name: "Dr. Geoffrey Hill"
description: "Marquee portfolio for Dr. Geoffrey Hill at the University of Central Arkansas."
url: "https://ghill11.github.io"
baseurl: "/marquee-portfolio"
locale: "en-US"

# Theme
minimal_mistakes_skin: "uca"     # custom UCA-purple skin (see _sass/.../skins/_uca.scss)
search: true
read_time: true
words_per_minute: 220

# Author sidebar (shown on per-artifact pages)
author:
  name:   "Dr. Geoffrey Hill"
  bio:    "Student portfolio published via Marquee at the University of Central Arkansas."
  avatar: "https://github.com/ghill11.png"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ghill11"

# Plugins (must appear in the github-pages gem allowlist)
# jekyll-remote-theme is REQUIRED for the `remote_theme` directive above
# to actually load Minimal Mistakes. Without it, GitHub Pages silently
# falls back to its default theme and the entire MM scaffold (layouts,
# skin, includes) is dead code.
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
# Each artifact is a document in the `artifacts` collection, rendered at
# /artifacts/<slug>/. The landing page iterates site.artifacts.
collections:
  artifacts:
    output: true
    permalink: /artifacts/:path/

# Defaults
defaults:
  # Per-artifact pages
  - scope:
      path: ""
      type: artifacts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: false
      toc: false
      classes: wide
  # Site-wide pages (index, 404)
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# SEO
# jekyll-seo-tag picks up these fields automatically and emits OG, Twitter
# Card, and JSON-LD blocks on every page. We layer additional Person and
# ItemList JSON-LD via _includes/head_custom.html.
twitter:
  username: ""
social:
  type: Person
  name: "Dr. Geoffrey Hill"
  links:
    - "https://github.com/ghill11"

# Build settings
markdown: kramdown
highlighter: rouge
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .sass-cache
  - .jekyll-cache
  - node_modules

# Marquee provenance (for graduation-readiness MAINTENANCE.md generation)
marquee:
  generated_by: "marquee"
  generated_at: "2026-04-27T19:13:21.987322+00:00"
  source_repo:  "https://github.com/ghill11/marquee-portfolio"
